name: build-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0). Leave empty for dry-run build only."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
          - goos: darwin
            goarch: amd64
            runner: macos-13
          - goos: darwin
            goarch: arm64
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Build c-shared .so
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
        run: |
          set -e
          OUT="manager-key-pro_${GOOS}_${GOARCH}"
          go build -buildvcs=false -buildmode=c-shared -o "${OUT}.so" ./cmd/manager-key-pro
          ls -la "${OUT}".*
          zip -j "${OUT}.zip" "${OUT}.so"
          # sha256sum does not exist on macOS; use shasum there.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${OUT}.zip" > "${OUT}.sha256"
          else
            shasum -a 256 "${OUT}.zip" > "${OUT}.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: so-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            manager-key-pro_*.zip
            manager-key-pro_*.sha256

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Assemble checksums
        run: |
          set -e
          cd artifacts
          ls -la
          cat *.sha256 > checksums.txt
          cat checksums.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            artifacts/*.zip
            artifacts/checksums.txt
          generate_release_notes: true
