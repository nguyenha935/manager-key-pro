<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manager Key Pro</title>
<style>
/* ===== Design tokens — đồng bộ panel CPA (warm grey, 3 theme) ===== */
:root{
  --bg-secondary:#faf9f5;--bg-primary:#f0eee8;--bg-tertiary:#e9e6df;--bg-hover:var(--bg-tertiary);
  --bg-quinary:#f6f4ee;--bg-error-light:rgba(198,87,70,.1);
  --floating-surface:#fffdf9;--floating-shadow:0 12px 26px rgba(0,0,0,.14);
  --text-primary:#2d2a26;--text-secondary:#6d6760;--text-tertiary:#a29c95;--text-quaternary:#c0bab3;
  --border-color:#e3e1db;--border-primary:#d5d2cb;--border-hover:#cecac4;
  --primary-color:#8b8680;--primary-hover:#7f7a74;--primary-active:#726d67;--primary-contrast:#fff;
  --success-color:#10b981;--quota-medium-color:#e0aa14;--warning-color:#c65746;--error-color:#c65746;--danger-color:var(--error-color);
  --warning-bg:rgba(198,87,70,.12);--warning-border:rgba(198,87,70,.35);
  --success-badge-bg:#d1fae5;--success-badge-text:#065f46;--success-badge-border:#6ee7b7;
  --failure-badge-bg:rgba(198,87,70,.14);--failure-badge-text:#8a3a30;--failure-badge-border:rgba(198,87,70,.35);
  --count-badge-bg:rgba(139,134,128,.18);--count-badge-text:var(--primary-active);
  --shadow:0 1px 2px 0 rgb(0 0 0/.08);--shadow-lg:0 10px 18px -3px rgb(0 0 0/.1);
  --radius-md:8px;
  --primary-8:color-mix(in srgb,var(--primary-color) 8%,transparent);
  --primary-10:color-mix(in srgb,var(--primary-color) 10%,transparent);
  --primary-30:color-mix(in srgb,var(--primary-color) 30%,transparent);
  --amber-color:#d97706;--amber-text:#92400e;
  --amber-10:color-mix(in srgb,var(--amber-color) 10%,transparent);
  --amber-30:color-mix(in srgb,var(--amber-color) 30%,transparent);
  --destructive-color:var(--error-color);
  --destructive-10:color-mix(in srgb,var(--destructive-color) 10%,transparent);
  --muted-bg:var(--bg-tertiary);--muted-foreground:var(--text-secondary);--accent-bg:var(--bg-tertiary);
  --glass-blur:12px;--glass-backdrop-filter:blur(var(--glass-blur));
  --glass-bg:color-mix(in srgb,var(--bg-primary) 82%,transparent);
  --glass-bg-secondary:color-mix(in srgb,var(--bg-secondary) 82%,transparent);
  --glass-border:color-mix(in srgb,var(--border-color) 60%,transparent);
  --viz-success:#10b981;--viz-failure:#c65746;
  --ease-out-strong:cubic-bezier(.23,1,.32,1);--dur-press:160ms;--dur-hover:200ms;
  --font-body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
  --font-mono:ui-monospace,'SF Mono','Cascadia Mono','JetBrains Mono',Menlo,Consolas,monospace;
}
html[data-theme='white']{
  --bg-secondary:#ffffff;--bg-primary:#ffffff;--bg-tertiary:#f6f6f6;--bg-hover:var(--bg-tertiary);
  --bg-quinary:#ffffff;--bg-error-light:rgba(198,87,70,.08);
  --floating-surface:#ffffff;--floating-shadow:0 12px 26px rgba(0,0,0,.12);
  --border-color:#e5e5e5;--border-primary:#d9d9d9;--border-hover:#cccccc;
  --glass-bg:color-mix(in srgb,var(--bg-primary) 82%,transparent);
  --glass-bg-secondary:color-mix(in srgb,var(--bg-secondary) 82%,transparent);
  --glass-border:color-mix(in srgb,var(--border-color) 60%,transparent);
}
html[data-theme='dark']{
  --bg-secondary:#151412;--bg-primary:#1d1b18;--bg-tertiary:#262320;--bg-hover:#2e2a26;
  --bg-quinary:#191714;--bg-error-light:rgba(198,87,70,.18);
  --floating-surface:#2a2723;--floating-shadow:0 14px 30px rgba(0,0,0,.4);
  --text-primary:#f6f4f1;--text-secondary:#c9c3bb;--text-tertiary:#9c958d;--text-quaternary:#6f6962;
  --border-color:#3a3530;--border-primary:#4a453f;--border-hover:#5a544d;
  --primary-hover:#9a948e;--primary-active:#a6a099;
  --quota-medium-color:#ffd862;
  --warning-bg:rgba(198,87,70,.22);--warning-border:rgba(198,87,70,.45);
  --warning-text:#f1b0a6;
  --success-badge-bg:rgba(6,78,59,.3);--success-badge-text:#6ee7b7;--success-badge-border:#059669;
  --failure-badge-bg:rgba(198,87,70,.24);--failure-badge-text:#f1b0a6;--failure-badge-border:rgba(198,87,70,.5);
  --count-badge-bg:rgba(139,134,128,.28);--count-badge-text:var(--primary-active);
  --shadow:0 1px 3px 0 rgb(0 0 0/.3);--shadow-lg:0 10px 15px -3px rgb(0 0 0/.3);
  --amber-color:#f59e0b;--amber-text:#fcd34d;
  --amber-10:color-mix(in srgb,var(--amber-color) 14%,transparent);
  --amber-30:color-mix(in srgb,var(--amber-color) 38%,transparent);
  --destructive-10:color-mix(in srgb,var(--destructive-color) 14%,transparent);
  --glass-border:color-mix(in srgb,var(--border-color) 55%,transparent);
  --viz-success:#0fae78;--viz-failure:#cf4b3a;
}
@media (max-width:768px),(prefers-reduced-motion:reduce),(prefers-reduced-transparency:reduce){
  :root{--glass-backdrop-filter:none;--glass-bg:var(--bg-primary);--glass-bg-secondary:var(--bg-secondary);--glass-border:var(--border-color)}
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg-secondary);color:var(--text-primary);font:14px/1.5 var(--font-body);-webkit-font-smoothing:antialiased}
a{color:var(--primary-active);text-decoration:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--bg-secondary)}
::-webkit-scrollbar-thumb{background:var(--border-color);border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:var(--border-hover)}

/* ===== Components ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:var(--radius-md);padding:10px 14px;font:600 14px var(--font-body);cursor:pointer;transition:all 150ms ease;background:var(--bg-secondary);color:var(--text-primary);white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn-primary{background:var(--primary-color);color:var(--primary-contrast);border-color:var(--primary-color)}
.btn-primary:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.btn-secondary{background:var(--bg-tertiary);border-color:var(--border-color);color:var(--text-primary)}
.btn-secondary:hover{background:var(--bg-hover);border-color:var(--border-hover)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--text-secondary)}
.btn-ghost:hover{color:var(--text-primary);background:var(--bg-tertiary)}
.btn-danger{background:var(--error-color);border-color:var(--error-color);color:#fff}
.btn-danger:hover{filter:brightness(.92)}
.btn-sm{padding:7px 10px;font-size:13px;border-radius:6px}
.btn-block{width:100%}
.btn svg{width:15px;height:15px}

input,select,textarea{width:100%;border:1px solid var(--border-color);border-radius:var(--radius-md);padding:10px 12px;background:var(--bg-secondary);color:var(--text-primary);font:14px var(--font-body);transition:border-color 150ms ease,box-shadow 150ms ease}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary-color);box-shadow:0 0 0 3px rgba(139,134,128,.18)}
input::placeholder{color:var(--text-quaternary)}
input[type=checkbox]{width:auto}
label{font-weight:600;font-size:13px;color:var(--text-primary);display:block;margin-bottom:5px}
.hint{color:var(--text-tertiary);font-size:12px;margin-top:4px}

.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font:600 11.5px var(--font-mono);letter-spacing:.02em;border:1px solid var(--border-color);color:var(--text-secondary)}
.badge-success{background:var(--success-badge-bg);color:var(--success-badge-text);border-color:var(--success-badge-border)}
.badge-error{background:var(--failure-badge-bg);color:var(--failure-badge-text);border-color:var(--failure-badge-border)}
.badge-warn{background:var(--amber-10);color:var(--amber-text);border-color:var(--amber-30)}
.badge-dot{width:6px;height:6px;border-radius:50%;background:currentColor}

.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--text-tertiary)}

.card{background:var(--bg-primary);border:1px solid var(--border-color);border-radius:12px;box-shadow:var(--shadow)}
.card-pad{padding:24px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px 20px;border-bottom:1px solid var(--border-color)}
.card-head h3{font-size:15px;font-weight:650;letter-spacing:-.01em}
.card-head .sub{font-size:12px;color:var(--text-tertiary)}

/* Tables — chuẩn CPA */
.tbl-wrap{border:1px solid var(--border-color);border-radius:var(--radius-md);overflow:hidden;background:var(--bg-primary);box-shadow:var(--shadow)}
.tbl-scroll{overflow-x:auto}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;color:var(--text-primary)}
thead{background:var(--muted-bg)}
thead th{color:var(--muted-foreground);font-weight:500;font-size:12px;text-align:left;padding:10px 14px;border-bottom:1px solid var(--border-color);white-space:nowrap}
tbody td{padding:12px 14px;border-bottom:1px solid var(--border-color);vertical-align:top}
tbody tr{transition:background-color 150ms ease}
tbody tr:hover td{background:color-mix(in srgb,var(--accent-bg) 50%,transparent)}
tbody tr:last-child td{border-bottom:none}
.tbl-empty{padding:36px;text-align:center;color:var(--text-tertiary);font-size:13px}
.actions{display:flex;gap:6px;flex-wrap:wrap}

/* Top navigation (content-only iframe) */
.shell{display:flex;flex-direction:column;min-height:100vh}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;padding:12px 22px;border-bottom:1px solid var(--border-color);background:var(--glass-bg-secondary);backdrop-filter:var(--glass-backdrop-filter);-webkit-backdrop-filter:var(--glass-backdrop-filter);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:6px}
.brand-mark{width:32px;height:32px;border-radius:9px;background:var(--primary-10);border:1px solid var(--primary-30);display:flex;align-items:center;justify-content:center;color:var(--primary-active);flex-shrink:0}
.brand-mark svg{width:17px;height:17px}
.brand h1{font-size:13.5px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.brand p{font:500 10px var(--font-mono);color:var(--text-tertiary);letter-spacing:.06em;margin-top:2px}
.topnav{display:flex;gap:2px;overflow-x:auto;flex:1;min-width:0}
.nav-item{display:inline-flex;align-items:center;gap:8px;padding:8px 13px;border-radius:var(--radius-md);cursor:pointer;color:var(--text-secondary);font-size:13.5px;font-weight:500;transition:background 150ms ease,color 150ms ease;position:relative;border:none;background:none;text-align:left;font-family:var(--font-body);white-space:nowrap}
.nav-item svg{width:16px;height:16px;flex-shrink:0}
.nav-item:hover{background:var(--bg-tertiary);color:var(--text-primary)}
.nav-item.active{background:var(--primary-8);color:var(--primary-active);font-weight:600}
.side-foot{display:flex;align-items:center;gap:8px;font:500 11px var(--font-mono);color:var(--text-quaternary);letter-spacing:.03em}
.conn-dot{width:7px;height:7px;border-radius:50%;background:var(--viz-success);flex-shrink:0}
.main{flex:1;min-width:0;padding:30px 28px 60px}
@media (max-width:768px){.topbar{flex-direction:column;align-items:flex-start;gap:8px}.topnav{width:100%}.main{padding:20px 16px 60px}}
/* Page container */
.page{max-width:1120px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:36px}
.page-head{display:flex;flex-direction:column;gap:6px}
.eyebrow{display:inline-flex;align-items:center;gap:7px;font:700 11px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--text-tertiary)}
.eyebrow::before{content:'▍';color:var(--viz-success);font-size:12px;line-height:1}
.page-title{font-size:clamp(24px,3vw,32px);font-weight:650;letter-spacing:-.02em;line-height:1.15}
.page-desc{font-size:14px;color:var(--text-secondary);max-width:64ch;line-height:1.6}
.page-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:6px}

/* Dashboard hero */
.hero{position:relative;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(300px,.9fr);gap:clamp(24px,4vw,52px);align-items:center;padding:8px 0 26px}
.ambient{position:absolute;inset:-20px -30px auto;height:420px;z-index:-1;pointer-events:none;overflow:hidden}
.wash-top{position:absolute;top:0;left:50%;width:min(960px,96vw);height:380px;transform:translateX(-50%);background:radial-gradient(ellipse 75% 70% at 50% 18%,color-mix(in srgb,var(--viz-success) 10%,transparent),transparent 70%);mask-image:linear-gradient(to bottom,transparent,#000 26%,#000 62%,transparent);-webkit-mask-image:linear-gradient(to bottom,transparent,#000 26%,#000 62%,transparent)}
.grid-wash{position:absolute;inset:0;background-image:linear-gradient(to right,var(--border-color) 1px,transparent 1px),linear-gradient(to bottom,var(--border-color) 1px,transparent 1px);background-size:72px 72px;opacity:.24;mask-image:linear-gradient(to bottom,transparent,#000 48px),radial-gradient(ellipse 70% 60% at 50% 0%,#000 0%,transparent 78%);-webkit-mask-image:linear-gradient(to bottom,transparent,#000 48px),radial-gradient(ellipse 70% 60% at 50% 0%,#000 0%,transparent 78%);mask-composite:intersect;-webkit-mask-composite:source-in}
.hero-copy{display:flex;flex-direction:column;gap:14px;min-width:0}
.hero-title{font-size:clamp(38px,5vw,58px);line-height:1.06;font-weight:700;letter-spacing:-.035em;text-wrap:balance}
.hero-period{display:inline;margin-left:.1em;letter-spacing:0}
.hero-period.live{animation:breath 3.2s ease-in-out 1.8s infinite}
@keyframes breath{0%,100%{opacity:1}50%{opacity:.35}}
.hero-meta{font:500 13px var(--font-mono);letter-spacing:.02em;color:var(--text-secondary);font-variant-numeric:tabular-nums}
.hero-actions{display:flex;gap:12px;align-items:center;margin-top:4px;flex-wrap:wrap}
.pill-action{display:inline-flex;align-items:center;gap:6px;padding:11px 20px;border-radius:99px;font-size:14px;font-weight:600;background:var(--text-primary);color:var(--bg-secondary);border:1px solid transparent;cursor:pointer;transition:transform var(--dur-press) var(--ease-out-strong),background var(--dur-hover) ease}
.pill-action:hover{transform:translateY(-1px);background:color-mix(in srgb,var(--text-primary) 86%,var(--bg-secondary))}
.pill-action:active{transform:scale(.97)}
.ghost-link{display:inline-flex;align-items:center;gap:6px;padding:11px 8px;font-size:14px;font-weight:600;color:var(--text-secondary);background:none;border:none;cursor:pointer;font-family:var(--font-body)}
.ghost-link:hover{color:var(--text-primary)}
.ghost-link .arr{display:inline-block;transition:transform var(--dur-hover) var(--ease-out-strong)}
.ghost-link:hover .arr{transform:translateX(3px)}

.hero-panel{position:relative;display:flex;flex-direction:column;gap:8px;padding:clamp(20px,2.4vw,28px);border-radius:20px;border:1px solid var(--glass-border);background:linear-gradient(145deg,color-mix(in srgb,var(--bg-primary) 90%,transparent),color-mix(in srgb,var(--bg-secondary) 74%,transparent));backdrop-filter:var(--glass-backdrop-filter);-webkit-backdrop-filter:var(--glass-backdrop-filter);box-shadow:var(--shadow-lg)}
.hero-panel-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.panel-label{font:700 11px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--text-tertiary)}
.live-badge{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:99px;border:1px solid color-mix(in srgb,var(--viz-success) 35%,transparent);background:color-mix(in srgb,var(--viz-success) 8%,transparent);font:700 10px var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--success-badge-text)}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--viz-success);animation:ping 2s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--viz-success) 45%,transparent)}70%{box-shadow:0 0 0 6px transparent}100%{box-shadow:0 0 0 0 transparent}}
.hero-figure{font:600 clamp(36px,4.5vw,54px)/1.05 var(--font-mono);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hero-panel-meta{font:500 12px var(--font-mono);color:var(--text-secondary)}
.ratio-bar{display:flex;gap:2px;height:6px;margin-top:8px;border-radius:3px;overflow:hidden}
.ratio-seg{min-width:4px;background:var(--viz-success)}
.ratio-seg.fail{background:var(--viz-failure)}
.hero-split{display:flex;flex-wrap:wrap;gap:14px;padding-top:10px;border-top:1px solid var(--border-color);font-size:12px;color:var(--text-secondary)}
.hero-split b{font:600 12px var(--font-mono);color:var(--text-primary)}
.swatch{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:5px}

/* KPI tiles */
.kpi-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.kpi{display:flex;flex-direction:column;gap:6px;padding:22px;border-radius:14px;border:1px solid var(--border-color);background:color-mix(in srgb,var(--bg-primary) 82%,transparent);transition:border-color 150ms ease}
.kpi:hover{border-color:var(--border-hover)}
.kpi::before{content:'';width:28px;height:3px;margin-bottom:2px;border-radius:99px;background:var(--tile-accent,var(--border-hover))}
.kpi-label{font-size:12px;font-weight:600;color:var(--text-secondary)}
.kpi-value{font:600 27px/1.1 var(--font-mono);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.kpi-hint{font-size:12px;line-height:1.45;color:var(--text-tertiary)}
.meter{height:5px;border-radius:99px;background:var(--bg-tertiary);overflow:hidden;margin:2px 0}
.meter i{display:block;height:100%;border-radius:99px;background:var(--viz-success)}
.meter i.warn{background:var(--quota-medium-color)}
.meter i.bad{background:var(--viz-failure)}

/* Sections */
.section{display:flex;flex-direction:column;gap:18px}
.section-head{display:flex;flex-direction:column;gap:6px}
.section-title{font-size:clamp(19px,2.2vw,24px);font-weight:650;letter-spacing:-.02em}
.section-desc{font-size:13.5px;color:var(--text-secondary);max-width:64ch}
.panel{display:flex;flex-direction:column;gap:16px;padding:clamp(20px,2.2vw,26px);border-radius:16px;border:1px solid var(--border-color);background:color-mix(in srgb,var(--bg-primary) 82%,transparent)}
.panel-title{font-size:16px;font-weight:650;letter-spacing:-.01em}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.note{font-size:13px;color:var(--text-secondary);line-height:1.6}

/* Form */
.form-group{display:flex;flex-direction:column;margin-bottom:14px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-inline{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.form-inline .form-group{margin:0}
.form-inline .form-group.grow{flex:1;min-width:150px}

/* Tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border-color);margin-bottom:20px;overflow-x:auto}
.tab{padding:10px 16px;font-size:13.5px;font-weight:600;color:var(--text-tertiary);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;font-family:var(--font-body);transition:color 150ms ease}
.tab:hover{color:var(--text-primary)}
.tab.active{color:var(--primary-active);border-bottom-color:var(--primary-color)}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(20,18,15,.45);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;backdrop-filter:blur(3px)}
.modal{background:var(--floating-surface);border-radius:16px;box-shadow:var(--floating-shadow);width:100%;max-width:520px;max-height:88vh;overflow-y:auto;border:1px solid var(--border-color)}
.modal-lg{max-width:720px}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border-color);position:sticky;top:0;background:var(--floating-surface)}
.modal-head h3{font-size:16px;font-weight:650}
.modal-body{padding:22px}
.close-x{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:none;border:none;color:var(--text-tertiary);cursor:pointer}
.close-x:hover{background:var(--bg-tertiary);color:var(--text-primary)}

/* Reveal key box */
.reveal-box{font:13px/1.6 var(--font-mono);background:var(--bg-quinary);border:1px dashed var(--border-hover);border-radius:10px;padding:14px 16px;word-break:break-all;margin:14px 0;color:var(--text-primary)}

/* Toast */
.toast{position:fixed;top:20px;right:20px;z-index:2000;background:var(--floating-surface);color:var(--text-primary);border:1px solid var(--border-color);border-radius:10px;padding:11px 18px;font-size:13.5px;font-weight:500;box-shadow:var(--floating-shadow);animation:toastIn .25s var(--ease-out-strong);display:flex;gap:8px;align-items:center}
.toast.err{border-color:var(--warning-border);background:var(--warning-bg);color:var(--text-primary)}

@keyframes skel{from{background-position:200% 0}to{background-position:-200% 0}}

@media (max-width:960px){
  .kpi-row{grid-template-columns:repeat(2,1fr)}

  .grid-2{grid-template-columns:1fr}
}
@media (max-width:768px){
  .sidebar{width:64px;padding:20px 8px}
  .brand h1,.brand p,.nav-item span.lbl,.side-foot span{display:none}
  .nav-item{justify-content:center;padding:10px}
  .nav-item.active::before{display:none}

@media (max-width:520px){.kpi-row{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

<body>
<div id="root"></div>
<script>
'use strict';
/* ===== helpers ===== */
const $  = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmtInt = n => (n||0).toLocaleString('vi-VN');
const fmtMicro = n => ((n||0)/1e6).toLocaleString('vi-VN',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' cr';
const fmtDate = ts => ts ? new Date(ts).toLocaleString('vi-VN',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}) : '∞';
const fmtShortDate = ts => ts ? new Date(ts).toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit'}) + ' ' + new Date(ts).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'}) : '—';

let mgmtKey = sessionStorage.getItem('mkp_key') || localStorage.getItem('mkp_admin_key') || '';
let currentPage = 'dashboard';
let sysTab = 'logs';
const MGMT_BASE = '/v0/management/plugins/manager-key-pro';

/* ===== theme sync với panel mẹ (iframe cùng origin) ===== */
function applyTheme(t, fromParent){
  if (t) document.documentElement.setAttribute('data-theme', t);
  else document.documentElement.removeAttribute('data-theme');
  if (!fromParent) { try{localStorage.setItem('mkp_theme', t||'');}catch(e){} }
}
function syncTheme(){
  try {
    const p = (window.parent && window.parent !== window) ? window.parent.document.documentElement : null;
    if (p) {
      applyTheme(p.getAttribute('data-theme')||'', true);
      new MutationObserver(()=>applyTheme(p.getAttribute('data-theme')||'', true))
        .observe(p, {attributes:true, attributeFilter:['data-theme']});
      return;
    }
  } catch(e){}
  applyTheme((localStorage.getItem('mkp_theme')||''), false);
}

/* ===== đọc management key panel CPA đã lưu ===== */
const ENC_PREFIX = 'enc::v1::';
const SECRET_SALT = 'cli-proxy-api-webui::secure-storage';
const STORAGE_KEY = 'cli-proxy-auth';
function _xorkey(){ return new TextEncoder().encode(SECRET_SALT+'|'+window.location.host+'|'+navigator.userAgent); }
function _deobf(p){ if(!p||!p.startsWith(ENC_PREFIX)) return p; const b=atob(p.slice(ENC_PREFIX.length)), k=_xorkey(); let s=''; for(let i=0;i<b.length;i++){ s+=String.fromCharCode(b.charCodeAt(i)^k[i%k.length]);} return s; }
function isEmbedded(){ try { return window.self !== window.top; } catch(e){ return false; } }
function readPanelMgmtKey(){
  if (!isEmbedded()) return '';
  let raw = null;
  try { raw = localStorage.getItem(STORAGE_KEY); } catch(e){ return ''; }
  if (!raw) return '';
  try {
    const obj = JSON.parse(_deobf(raw));
    const state = (obj && obj.state) || obj;
    if (state && typeof state.managementKey === 'string' && state.managementKey) return state.managementKey;
  } catch(e){}
  return '';
}

/* ===== api ===== */
async function api(method, path, body){
  const opts = { method, headers:{'Authorization':'Bearer '+mgmtKey} };
  if (body !== undefined){ opts.headers['Content-Type']='application/json'; opts.body = JSON.stringify(body); }
  const r = await fetch(MGMT_BASE + path, opts);
  let data = null;
  try { data = await r.json(); } catch(e){}
  if (!r.ok) throw new Error((data && data.error) || method+' '+path+': '+r.status);
  return data;
}
const apiGet  = p => api('GET', p);
const apiPost = (p,b) => api('POST', p, b||{});

function toast(msg, isErr){
  const el = document.createElement('div');
  el.className = 'toast' + (isErr?' err':'');
  el.innerHTML = (isErr
    ? '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--viz-failure)" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>'
    : '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--viz-success)" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>');
  el.appendChild(document.createTextNode(msg));
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 3200);
}
function showModal(html, large){
  const ov = document.createElement('div');
  ov.className = 'modal-overlay';
  ov.innerHTML = '<div class="modal'+(large?' modal-lg':'')+'">'+html+'</div>';
  ov.addEventListener('click', e => { if(e.target===ov) ov.remove(); });
  document.body.appendChild(ov);
  return ov;
}
function closeModal(){ $('.modal-overlay')?.remove(); }
const modalHead = t => '<div class="modal-head"><h3>'+t+'</h3><button class="close-x" onclick="closeModal()" aria-label="Đóng"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>';

/* sparkline SVG từ mảng số */
function sparkSVG(values, h, ok){
  const w = 320;
  if (!values.length) return '';
  const max = Math.max(...values, 1);
  const step = w / Math.max(values.length-1, 1);
  const pts = values.map((v,i)=>[i*step, h - 6 - (v/max)*(h-14)]);
  const line = pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area = line + ' L '+w+' '+h+' L 0 '+h+' Z';
  const last = pts[pts.length-1];
  const col = ok ? 'var(--viz-success)' : 'var(--primary-color)';
  return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:'+h+'px;display:block" preserveAspectRatio="none">'
    + '<path d="'+area+'" fill="'+col+'" opacity=".1"/>'
    + '<path d="'+line+'" fill="none" stroke="'+col+'" stroke-width="1.8" vector-effect="non-scaling-stroke"/>'
    + '<circle cx="'+last[0]+'" cy="'+last[1]+'" r="3" fill="'+col+'"/></svg>';
}

/* ===== DASHBOARD ===== */
async function renderDashboard(){
  const [s, u, k] = await Promise.all([apiGet('/stats'), apiGet('/usage'), apiGet('/keys')]);
  const usage = u.usage || [];
  const keyTotal = (k.keys||[]).length;
  const revenue = s.revenue_micro || 0;
  const spent = s.total_cost_micro || 0;
  const live = s.total_requests > 0;

  let verdict, accent;
  if (revenue > 0){ verdict = 'Doanh thu đang chảy'; accent = 'var(--viz-success)'; }
  else if (s.total_requests > 0){ verdict = 'Hệ thống đang phục vụ'; accent = 'var(--viz-success)'; }
  else if (s.total_users > 0){ verdict = 'Sẵn sàng bán hàng'; accent = 'var(--quota-medium-color)'; }
  else { verdict = 'Bắt đầu từ đây'; accent = 'var(--text-quaternary)'; }

  /* sparkline: nhóm usage theo giờ gần nhất */
  const buckets = {};
  usage.forEach(x => { const hr = Math.floor(x.created_at/3600000); buckets[hr] = (buckets[hr]||0)+1; });
  const hrs = Object.keys(buckets).map(Number).sort((a,b)=>a-b).slice(-24);
  const sparkVals = hrs.map(h=>buckets[h]);

  const recent = usage.slice(0,8).map(x => '<tr>'
    + '<td class="mono muted" style="font-size:11.5px">'+fmtShortDate(x.created_at)+'</td>'
    + '<td>'+esc(x.requested_name || x.model || '—')+'</td>'
    + '<td class="mono">'+fmtInt(x.input_tokens)+' / '+fmtInt(x.output_tokens)+'</td>'
    + '<td class="mono">'+fmtMicro(x.cost)+'</td>'
    + '<td>'+(x.billed ? '<span class="badge badge-success"><i class="badge-dot"></i>đã trừ</span>' : '<span class="badge">giữ chỗ</span>')+'</td>'
    + '</tr>').join('');

  const keyPct = null; /* placeholder */
  return '<div class="page">'
  + '<div class="hero"><div class="ambient" aria-hidden="true"><span class="wash-top"></span><span class="grid-wash"></span></div>'
    + '<div class="hero-copy">'
      + '<h1 class="hero-title">'+verdict+'<span class="hero-period'+(live?' live':'')+'" style="color:'+accent+'">.</span></h1>'
      + '<p class="hero-meta">v0.2.0 · '+fmtInt(s.active_keys)+' keys hoạt động · '+fmtInt(s.total_users)+' người dùng</p>'
      + '<div class="hero-actions">'
        + '<button class="pill-action" onclick="navigate(\'keys\');showCreateKey()">Tạo key mới</button>'
        + '<button class="ghost-link" onclick="navigate(\'system\')">Kiểm tra hệ thống <span class="arr">→</span></button>'
      + '</div>'
    + '</div>'
    + '<div class="hero-panel">'
      + '<div class="hero-panel-top"><span class="panel-label">Tổng nạp ví</span>'
        + (live ? '<span class="live-badge"><i class="live-dot"></i>live</span>' : '<span class="badge">chờ dữ liệu</span>')
      + '</div>'
      + '<strong class="hero-figure">'+fmtMicro(revenue)+'</strong>'
      + '<span class="hero-panel-meta">'+fmtInt(s.paid_orders)+' đơn đã trả · '+fmtInt(s.pending_users)+' user chờ duyệt</span>'
      + '<div class="ratio-bar" aria-hidden="true">'
        + '<span class="ratio-seg" style="flex:'+(revenue||1)+'"></span>'
        + '<span class="ratio-seg fail" style="flex:'+(spent||1)+'"></span>'
      + '</div>'
      + '<div class="hero-split">'
        + '<span><i class="swatch" style="background:var(--viz-success)"></i>Nạp vào <b>'+fmtMicro(revenue)+'</b></span>'
        + '<span><i class="swatch" style="background:var(--viz-failure)"></i>Chi phí trừ <b>'+fmtMicro(spent)+'</b></span>'
      + '</div>'
    + '</div>'
  + '</div>'

  + '<div class="kpi-row">'
    + '<div class="kpi" style="--tile-accent:var(--viz-success)"><span class="kpi-label">Key hoạt động</span><strong class="kpi-value">'+fmtInt(s.active_keys)+'</strong><span class="kpi-hint">trên tổng '+fmtInt(keyTotal)+' key đã tạo</span></div>'
    + '<div class="kpi" style="--tile-accent:var(--primary-color)"><span class="kpi-label">Tổng request đã trừ</span><strong class="kpi-value">'+fmtInt(s.total_requests)+'</strong><span class="kpi-hint">ghi nhận qua usage hook</span></div>'
    + '<div class="kpi" style="--tile-accent:var(--amber-color)"><span class="kpi-label">Chờ duyệt</span><strong class="kpi-value">'+fmtInt(s.pending_users)+'</strong><span class="kpi-hint">'+(s.pending_users>0?'cần xử lý trong mục Người dùng':'không có ai chờ')+'</span></div>'
    + '<div class="kpi" style="--tile-accent:var(--viz-failure)"><span class="kpi-label">Chi phí đã trừ</span><strong class="kpi-value" style="font-size:22px">'+fmtMicro(spent)+'</strong><span class="kpi-hint">'+fmtInt(s.total_requests)+' request tính tiền</span></div>'
  + '</div>'

  + '<div class="section">'
    + '<div class="section-head"><span class="eyebrow">Lưu lượng</span><h2 class="section-title">Request theo giờ</h2></div>'
    + '<div class="grid-2">'
      + '<div class="panel">'
        + '<div class="panel-title">24 giờ gần nhất</div>'
        + (sparkVals.length ? sparkSVG(sparkVals, 120, true) : '<p class="note tbl-empty">Chưa có request nào — sparkline sẽ hiện khi có traffic.</p>')
      + '</div>'
      + '<div class="panel">'
        + '<div class="panel-title">Request mới nhất</div>'
        + '<div class="tbl-wrap"><div class="tbl-scroll"><table>'
        + '<thead><tr><th>Thời gian</th><th>Model</th><th>In / Out</th><th>Chi phí</th><th>Trạng thái</th></tr></thead>'
        + '<tbody>'+(recent || '<tr><td colspan="5" class="tbl-empty">Chưa có dữ liệu</td></tr>')+'</tbody>'
        + '</table></div></div>'
      + '</div>'
    + '</div>'
  + '</div>'
  + '</div>';
}


/* ===== KEY DETAIL ===== */
async function keyDetail(id){
  try {
    const k = await apiGet('/keys/detail?id='+encodeURIComponent(id));
    window._curKeyDetail = k;
    const pct = k.quota_amount>0 ? Math.min(100, k.quota_used/k.quota_amount*100) : 0;
    const mCls = pct>=90?'bad':pct>=70?'warn':'';
    const resets = k.period_end>0 ? fmtShortDate(k.period_end) : 'không (lifetime)';
    const bindRows = (k.bindings||[]).map(b=>'<tr>'
      + '<td><span class="mono" style="font-size:12px">'+esc(b.account_ref)+'</span><div class="muted" style="font-size:11px">'+esc(b.account_type||'—')+(b.enabled?'':' · tắt')+'</div></td>'
      + '<td class="mono">'+fmtInt(b.share_percent)+'%</td>'
      + '<td class="mono">'+fmtInt(b.priority)+'</td>'
      + '<td><button class="btn btn-secondary btn-sm" onclick="delBinding('+b.id+')">Xoá</button></td>'
      + '</tr>').join('');
    showModal(modalHead('Key '+esc(k.prefix))
    + '<div class="modal-body" style="display:flex;flex-direction:column;gap:14px">'
      + '<div class="panel" style="padding:16px"><div class="form-row">'
        + '<div class="form-group"><label>Tên key</label><input id="kd-name" value="'+esc(k.name||'')+'"></div>'
        + '<div class="form-group"><label>Chuyển sang user (ID)</label><input id="kd-user" value="'+esc(k.user_id)+'" placeholder="user_id"></div>'
      + '</div>'
      + '<div class="form-row">'
        + '<div class="form-group"><label>Plan</label><select id="kd-plan"><option value="windowed"'+(k.plan_type==='windowed'?' selected':'')+'>Cửa sổ</option><option value="lifetime"'+(k.plan_type!=='windowed'?' selected':'')+'>Lifetime</option></select></div>'
        + '<div class="form-group"><label>Loại quota</label><select id="kd-kind">'+['token','credit','request','unlimited'].map(x=>'<option value="'+x+'"'+(x===k.quota_kind?' selected':'')+'>'+x+'</option>').join('')+'</select></div>'
      + '</div>'
      + '<div class="form-row">'
        + '<div class="form-group"><label>Hạn mức</label><input id="kd-amount" type="number" value="'+k.quota_amount+'"></div>'
        + '<div class="form-group"><label>Window hours (0 = theo scope)</label><input id="kd-window" type="number" value="'+(k.window_hours||0)+'"></div>'
      + '</div>'
      + '<div class="form-row">'
        + '<div class="form-group"><label>Expires (epoch ms, 0 = vô hạn)</label><input id="kd-expires" type="number" value="'+k.expires_at+'"></div>'
        + '<div class="form-group"><label>RPM</label><input id="kd-rpm" type="number" value="'+k.rpm+'"></div>'
      + '</div>'
      + '<div class="form-group"><label style="display:flex;gap:8px;align-items:center;font-weight:500"><input type="checkbox" id="kd-overflow" '+(k.overflow_to_wallet?'checked':'')+'> Tràn phần thừa sang ví user</label></div>'
      + '<div class="form-row">'
        + '<div class="form-group"><label>Models cho phép (phẩy)</label><input id="kd-models" value="'+esc((k.allowed_models||[]).join(', '))+'"></div>'
        + '<div class="form-group"><label>Providers cho phép</label><input id="kd-providers" value="'+esc((k.allowed_providers||[]).join(', '))+'"></div>'
      + '</div>'
      + '<div class="form-group"><label>IP allowlist (phẩy)</label><input id="kd-ips" value="'+esc((k.ip_allowlist||[]).join(', '))+'"></div>'
      + '<div class="form-row">'
        + '<div class="form-group"><label>Log mode</label><select id="kd-log"><option value="">theo toàn cục</option>'+['full','standard','error_only'].map(x=>'<option value="'+x+'"'+(x===k.log_mode?' selected':'')+'>'+x+'</option>').join('')+'</select></div>'
        + '<div class="form-group"><label>Trạng thái</label><span class="badge badge-success" style="margin-top:6px">'+esc(k.status)+'</span></div>'
      + '</div>'
      + '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-primary" onclick="saveKeyDetail(\''+k.id+'\')">Lưu thay đổi</button>'
      + '<button class="btn btn-secondary" onclick="revealKey(\''+k.id+'\')">Xem key</button>'
      + '<button class="btn btn-secondary" onclick="switchQuota(\''+k.id+'\',\''+k.quota_kind+'\',\''+k.quota_scope+'\','+k.quota_amount+','+k.expires_at+')">Hạn mức</button>'
      + '<button class="btn btn-danger" onclick="deleteKey(\''+k.id+'\')">Xóa</button></div>'
      + '</div>'
      + '<div class="panel" style="padding:16px"><div class="panel-title" style="font-size:14px">Quota đã dùng</div>'
        + '<div class="mono" style="font-size:13px;margin:6px 0">'+fmtInt(k.quota_used)+' / '+fmtInt(k.quota_amount)+' ('+pct.toFixed(1)+'%)</div>'
        + '<div class="meter" style="height:8px"><i class="'+mCls+'" style="width:'+pct+'%"></i></div>'
        + '<div class="muted" style="font-size:12px;margin-top:6px">Chu kỳ reset: <span class="mono">'+resets+'</span> · tạo: '+fmtShortDate(k.created_at)+(k.last_used_at?' · dùng: '+fmtShortDate(k.last_used_at):'')+'</div>'
      + '</div>'
      + '<div class="panel" style="padding:16px"><div class="panel-title" style="font-size:14px">Gán tài khoản upstream ('+fmtInt((k.bindings||[]).length)+' bindings)</div>'
        + '<p class="note" style="font-size:12px;margin:4px 0 8px">Định tuyến key theo % quota của từng CPA account. Không gán = key tự do chọn.</p>'
        + '<div class="tbl-wrap"><div class="tbl-scroll"><table><thead><tr><th>Tài khoản (AuthID/file id)</th><th>Share %</th><th>Ưu tiên</th><th></th></tr></thead><tbody>'
        +(bindRows||'<tr><td colspan="4" class="tbl-empty">Chưa gán account nào.</td></tr>')+'</tbody></table></div></div>'
        + '<div class="form-row" style="margin-top:10px">'
          + '<div class="form-group"><label>Account ref</label><input id="kb-ref" placeholder="VD: claude:apikey:sk-ant-... hoặc file id"></div>'
          + '<div class="form-group"><label>Share %</label><input id="kb-share" type="number" value="100"></div>'
        + '</div>'
        + '<div class="form-row">'
          + '<div class="form-group"><label>Loại</label><select id="kb-type"><option value="oauth">oauth</option><option value="apikey">apikey</option><option value="file">file</option><option value="resource">resource</option><option value="endpoint">endpoint</option></select></div>'
          + '<div class="form-group"><label>Ưu tiên</label><input id="kb-prio" type="number" value="0"></div>'
        + '</div>'
        + '<button class="btn btn-secondary" onclick="addBinding(\''+k.id+'\')">Thêm binding</button>'
      + '</div>'
    + '</div>');
  } catch(e){ toast('Lỗi: '+e.message, true); }
}
async function saveKeyDetail(id){
  try {
    const models = ($('#kd-models').value||'').split(',').map(x=>x.trim()).filter(Boolean);
    const providers = ($('#kd-providers').value||'').split(',').map(x=>x.trim()).filter(Boolean);
    const ips = ($('#kd-ips').value||'').split(',').map(x=>x.trim()).filter(Boolean);
    await apiPost('/keys/update', {
      id,
      name: $('#kd-name').value,
      user_id: $('#kd-user').value,
      allowed_models: models, allowed_providers: providers, ip_allowlist: ips,
      rpm: parseInt($('#kd-rpm').value)||60,
      log_mode: $('#kd-log').value || null,
      overflow_to_wallet: $('#kd-overflow').checked,
      set_models: true,
    });
    await apiPost('/keys/quota', {id,
      quota_kind: $('#kd-kind').value,
      quota_scope: $('#kd-plan').value==='windowed'?'day':'lifetime',
      quota_amount: parseInt($('#kd-amount').value)||0, expires_at: parseInt($('#kd-expires').value)||0});
    toast('Đã lưu cập nhật key');
    closeModal(); navigate('keys');
  } catch(e){ toast('Lỗi: '+e.message, true); }
}
async function addBinding(keyID){
  try {
    const ref = $('#kb-ref').value.trim();
    if (!ref){ toast('Nhập account_ref trước', true); return; }
    const existing = (window._curKeyDetail && window._curKeyDetail.bindings||[]).map(b=>({account_ref:b.account_ref,account_type:b.account_type,share_percent:b.share_percent,priority:b.priority,enabled:b.enabled}));
    existing.push({account_ref: ref, account_type: $('#kb-type').value, share_percent: parseInt($('#kb-share').value)||100, priority: parseInt($('#kb-prio').value)||0, enabled: true});

async function doCreateKey(){
  try {
    const body = { user_id: $('#ck-user').value, name: $('#ck-name').value,
      package_id: $('#ck-pkg').value || undefined, overflow_to_wallet: $('#ck-overflow').checked };
    if (!body.package_id){
      body.plan_type = $('#ck-plan').value;
      if (body.plan_type === 'windowed'){
        let wh = parseInt($('#ck-window').value)||0;
        if (wh === 0) wh = parseInt($('#ck-window-custom').value)||0;
        body.window_hours = wh || 5;
        body.quota_kind = $('#ck-kind').value;
        body.quota_amount = parseInt($('#ck-amount').value)||0;
      } else {
        body.quota_kind = $('#ck-kind').value; body.quota_scope = $('#ck-scope').value;
        body.quota_amount = parseInt($('#ck-amount').value)||0;
      }
      const days = parseInt($('#ck-days').value)||0;
      if (days > 0) body.expires_at = Date.now() + days*86400000;
    }
    if (!body.user_id) { toast('Chọn user trước', true); return; }
    const r = await apiPost('/keys', body);
    closeModal();
    showModal(modalHead('Key đã tạo')
    + '<div class="modal-body">'
      + '<p class="note">Có thể xem lại key này bất cứ lúc nào bằng nút “Xem”.</p>'
      + '<div class="reveal-box">'+esc(r.plain_key)+'</div>'
      + '<button class="btn btn-primary btn-block" onclick="copyText(\''+esc(r.plain_key)+'\')">Copy key</button>'
    + '</div>');
    navigate('keys');
  } catch(e){ toast('Lỗi: '+e.message, true); }
}

function togglePkgPlan(){
  const plan = $('#pk-plan').value;
  const row = $('#pk-window-row');
  if (row) row.style.display = plan==='windowed' ? '' : 'none';
  const custom = $('#pk-window-custom');
  if (custom) custom.disabled = plan!=='windowed';
  const scope = $('#pk-scope');
  if (scope) scope.value = plan==='windowed' ? 'day' : 'lifetime';
}
function onPkgWindow(){
  const w = $('#pk-window');
  const custom = $('#pk-window-custom');
  if (custom) custom.disabled = !(w && w.value==='0');
}

async function savePackage(id){
  try {
    let wh = 0;
    if ($('#pk-plan').value === 'windowed'){
      wh = parseInt($('#pk-window').value)||0;
      if (wh === 0) wh = parseInt($('#pk-window-custom').value)||0;
    }
    const body = { name: $('#pk-name').value, description: $('#pk-desc').value,
      plan_type: $('#pk-plan').value, window_hours: wh,
      quota_kind: $('#pk-kind').value, quota_scope: $('#pk-plan').value==='windowed' ? 'day' : $('#pk-scope').value,
      quota_amount: parseInt($('#pk-amount').value)||0, duration_days: parseInt($('#pk-days').value)||0,
      price_credit: parseInt($('#pk-price').value)||0, rpm: parseInt($('#pk-rpm').value)||60,
      visible: $('#pk-visible').checked };
    if (id) { body.id = id; await apiPost('/packages/update', body); }
    else await apiPost('/packages', body);
    closeModal(); toast('Đã lưu gói'); navigate('packages');
  } catch(e){ toast('Lỗi: '+e.message, true); }
}
async function delPackage(id){
  if (!confirm('Xóa gói này?')) return;
  try { await apiPost('/packages/delete', {id}); toast('Đã xóa gói'); navigate('packages'); }
  catch(e){ toast('Lỗi: '+e.message, true); }
}

async function saveReferral(){
  try {

  return '<div class="section">'

        + '<button class="btn btn-primary" onclick="downloadBackup()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Tải DB backup</button>'
        + '<input type="file" id="restore-file" accept=".db,.sqlite" style="width:auto;font-size:12px">'
        + '<button class="btn btn-danger" onclick="doRestore()">Restore từ file</button>'
      + '</div>'
    + '</div>'

      + '<div class="form-row"><div class="form-group"><label>Tỷ giá thủ công (VNĐ/USD)</label><input id="st-fx" value="'+esc((st.settings||{}).vnd_per_usd||'25000')+'"></div>'
      + '<div class="form-group"><label>Chế độ FX</label><select id="st-fxmode"><option value="manual"'+(st.settings.fx_mode==='manual'?' selected':'')+'>manual</option><option value="auto"'+(st.settings.fx_mode==='auto'?' selected':'')+'>auto</option></select></div></div>'
      + '<div class="form-row"><div class="form-group"><label>Chế độ thưởng affiliate</label><select id="st-refmode"><option value="percent"'+(st.settings.referral_mode==='percent'?' selected':'')+'>% theo tầng</option><option value="fixed"'+(st.settings.referral_mode==='fixed'?' selected':'')+'>Cố định</option></select></div>'
      + '<div class="form-group"><label>Tầng % (phẩy)</label><input id="st-reftiers" value="'+esc((st.settings.referral_tiers||'[10,3,1]'))+'"></div></div>'
      + '<div class="form-row"><div class="form-group"><label>Thưởng cố định (micro)</label><input id="st-reffixed" type="number" value="'+esc(st.settings.referral_fixed_credit||'1000000')+'"></div>'
      + '<div class="form-group"><label>Ngưỡng qualify (micro)</label><input id="st-refqualify" type="number" value="'+esc(st.settings.referral_qualify_recharge||'10000000')+'"></div></div>'
      + '<div class="form-row"><div class="form-group"><label>Log toàn cục</label><select id="st-logmode"><option value="standard"'+(st.settings.log_mode_global==='standard'?' selected':'')+'>standard</option><option value="full"'+(st.settings.log_mode_global==='full'?' selected':'')+'>full</option><option value="error_only"'+(st.settings.log_mode_global==='error_only'?' selected':'')+'>error_only</option></select></div>'
      + '<div class="form-group"><label>Full log TTL (giờ)</label><input id="st-ttl" type="number" value="'+esc(st.settings.full_log_retention_hours||'24')+'"></div></div>'
      + '<button class="btn btn-primary" onclick="saveSettingsForm()">Lưu cấu hình</button>'
    + '</div>'
  + '</div>';
}
async function saveSettingsForm(){
  try {
    await apiPost('/settings', {
      vnd_per_usd: $('#st-fx').value,
      fx_mode: $('#st-fxmode').value,
      referral_mode: $('#st-refmode').value,
      referral_tiers: $('#st-reftiers').value,
      referral_fixed_credit: $('#st-reffixed').value,
      referral_qualify_recharge: $('#st-refqualify').value,
      log_mode_global: $('#st-logmode').value,
      full_log_retention_hours: $('#st-ttl').value,
    });
    toast('Đã lưu cấu hình'); navigate('system');
  } catch(e){ toast('Lỗi: '+e.message, true); }
}
async function downloadBackup(){
  try {
    const r = await fetch(MGMT_BASE + '/backup', {headers:{'Authorization':'Bearer '+mgmtKey}});
    if (!r.ok) throw new Error('backup: '+r.status);
    const blob = await r.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'manager-key-pro-'+new Date().toISOString().slice(0,10)+'.db';
    a.click();
    toast('Đang tải backup…');
  } catch(e){ toast('Lỗi: '+e.message, true); }
}
async function doRestore(){
  const f = $('#restore-file').files[0];
  if (!f){ toast('Chọn file DB trước', true); return; }
  if (!confirm('Restore sẽ THAY TOÀN BỘ database hiện tại. Tiếp tục?')) return;
  try {
    const buf = await f.arrayBuffer();
    const r = await fetch(MGMT_BASE + '/restore', {
      method:'POST', headers:{'Authorization':'Bearer '+mgmtKey, 'Content-Type':'application/octet-stream'}, body: buf });
    const data = await r.json().catch(()=>({}));
    if (!r.ok) throw new Error(data.error || ('restore: '+r.status));
    toast('Restore thành công'); navigate('dashboard');
  } catch(e){ toast('Lỗi: '+e.message, true); }
}

const PAGES = {
  dashboard:'Tổng quan', keys:'Keys', users:'Người dùng',
  packages:'Gói & Đơn', pricing:'Bảng giá', system:'Hệ thống'
};

async function navigate(page){
  currentPage = page;
  $$('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.page===page));
  const content = $('#page-content');
  content.innerHTML = '<div class="page"><div class="skel" style="height:34px;width:260px"></div><div class="skel" style="height:120px"></div><div class="skel" style="height:300px"></div></div>';
  try {
    let html = '';
    if (page==='dashboard') html = await renderDashboard();
    else if (page==='keys') html = await renderKeys();
    else if (page==='users') html = await renderUsers();
    else if (page==='packages') html = await renderPackages();
    else if (page==='pricing') html = await renderPricing();
    else if (page==='system') html = await renderSystem();
    content.innerHTML = html;
  } catch(e){
    content.innerHTML = '<div class="page"><div class="panel" style="border-color:var(--warning-border);background:var(--warning-bg)"><div class="panel-title" style="color:var(--warning-text,var(--error-color))">Lỗi tải dữ liệu</div><p class="note">'+esc(e.message)+'</p><div><button class="btn btn-secondary" onclick="navigate(\''+page+'\')">Thử lại</button></div></div></div>';
  }
}

function renderApp(){
  const navItems = Object.entries(PAGES).map(([id,label]) =>
    '<button class="nav-item'+(id===currentPage?' active':'')+'" data-page="'+id+'" onclick="navigate(\''+id+'\')">'+ICONS[id]+'<span class="lbl">'+label+'</span></button>'
  ).join('');
  document.getElementById('root').innerHTML =
  '<div class="shell">'
    + '<header class="topbar">'
      + '<div class="brand"><div class="brand-mark">'+ICONS.keys+'</div><div><h1>Manager Key Pro</h1><p>ADMIN · v0.3.0</p></div></div>'
      + '<nav class="topnav">'+navItems+'</nav>'
      + '<div class="side-foot"><span class="conn-dot"></span><span>connected</span></div>'
    + '</header>'
    + '<main class="main"><div id="page-content"></div></main>'
  + '</div>';
  navigate(currentPage);
}

function showLogin(){
  document.getElementById('root').innerHTML =
  '<div class="login-wrap"><div class="login-card">'
    + '<div class="brand"><div class="brand-mark">'+ICONS.keys+'</div><div><h1>Manager Key Pro</h1><p>QUẢN TRỊ</p></div></div>'
    + '<p>Nhập Management Key của CPA để vào trang quản trị. Key này chính là key Cậu dùng đăng nhập panel CPA.</p>'
    + '<div id="login-err"></div>'
    + '<div class="form-group"><label>Management Key</label><input id="login-key" type="password" placeholder="••••••••" onkeydown="if(event.key===\'Enter\')doLogin()"></div>'
    + '<button class="btn btn-primary btn-block" onclick="doLogin()">Đăng nhập</button>'
  + '</div></div>';
  setTimeout(()=>$('#login-key')?.focus(), 100);
}
async function doLogin(){
  const key = $('#login-key').value.trim();
  if (!key) return;
  try {
    const r = await fetch(MGMT_BASE + '/stats', {headers:{'Authorization':'Bearer '+key}});
    if (r.status === 401 || r.status === 403){
      $('#login-err').innerHTML = '<p class="note" style="color:var(--error-color);margin-bottom:12px">Management key không đúng.</p>';
      return;
    }
    mgmtKey = key;
    try{ localStorage.setItem('mkp_admin_key', key); sessionStorage.setItem('mkp_key', key); }catch(e){}
    renderApp();
  } catch(e){
    $('#login-err').innerHTML = '<p class="note" style="color:var(--error-color);margin-bottom:12px">Lỗi kết nối: '+esc(e.message)+'</p>';
  }
}

/* ===== init ===== */
syncTheme();
if (!mgmtKey){
  const k = readPanelMgmtKey();
  if (k) { mgmtKey = k; try{ localStorage.setItem('mkp_admin_key', k); }catch(e){} }
}
if (mgmtKey) renderApp(); else showLogin();
