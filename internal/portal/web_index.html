<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manager Key Pro — Portal</title>
<style>
/* ===== Design tokens — đồng bộ panel CPA ===== */
:root{
  --bg-secondary:#faf9f5;--bg-primary:#f0eee8;--bg-tertiary:#e9e6df;--bg-hover:var(--bg-tertiary);
  --bg-quinary:#f6f4ee;--bg-error-light:rgba(198,87,70,.1);
  --floating-surface:#fffdf9;--floating-shadow:0 12px 26px rgba(0,0,0,.14);
  --text-primary:#2d2a26;--text-secondary:#6d6760;--text-tertiary:#a29c95;--text-quaternary:#c0bab3;
  --border-color:#e3e1db;--border-primary:#d5d2cb;--border-hover:#cecac4;
  --primary-color:#8b8680;--primary-hover:#7f7a74;--primary-active:#726d67;--primary-contrast:#fff;
  --success-color:#10b981;--quota-medium-color:#e0aa14;--warning-color:#c65746;--error-color:#c65746;--danger-color:var(--error-color);
  --warning-bg:rgba(198,87,70,.12);--warning-border:rgba(198,87,70,.35);
  --success-badge-bg:#d1fae5;--success-badge-text:#065f46;--success-badge-border:#6ee7b7;
  --failure-badge-bg:rgba(198,87,70,.14);--failure-badge-text:#8a3a30;--failure-badge-border:rgba(198,87,70,.35);
  --count-badge-bg:rgba(139,134,128,.18);--count-badge-text:var(--primary-active);
  --shadow:0 1px 2px 0 rgb(0 0 0/.08);--shadow-lg:0 10px 18px -3px rgb(0 0 0/.1);
  --radius-md:8px;
  --primary-8:color-mix(in srgb,var(--primary-color) 8%,transparent);
  --primary-10:color-mix(in srgb,var(--primary-color) 10%,transparent);
  --primary-30:color-mix(in srgb,var(--primary-color) 30%,transparent);
  --amber-color:#d97706;--amber-text:#92400e;
  --amber-10:color-mix(in srgb,var(--amber-color) 10%,transparent);
  --amber-30:color-mix(in srgb,var(--amber-color) 30%,transparent);
  --muted-bg:var(--bg-tertiary);--muted-foreground:var(--text-secondary);--accent-bg:var(--bg-tertiary);
  --glass-blur:12px;--glass-backdrop-filter:blur(var(--glass-blur));
  --glass-border:color-mix(in srgb,var(--border-color) 60%,transparent);
  --viz-success:#10b981;--viz-failure:#c65746;
  --ease-out-strong:cubic-bezier(.23,1,.32,1);--dur-press:160ms;--dur-hover:200ms;
  --font-body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
  --font-mono:ui-monospace,'SF Mono','Cascadia Mono','JetBrains Mono',Menlo,Consolas,monospace;
}
html[data-theme='dark']{
  --bg-secondary:#151412;--bg-primary:#1d1b18;--bg-tertiary:#262320;--bg-hover:#2e2a26;
  --bg-quinary:#191714;--bg-error-light:rgba(198,87,70,.18);
  --floating-surface:#2a2723;--floating-shadow:0 14px 30px rgba(0,0,0,.4);
  --text-primary:#f6f4f1;--text-secondary:#c9c3bb;--text-tertiary:#9c958d;--text-quaternary:#6f6962;
  --border-color:#3a3530;--border-primary:#4a453f;--border-hover:#5a544d;
  --primary-hover:#9a948e;--primary-active:#a6a099;
  --quota-medium-color:#ffd862;
  --warning-bg:rgba(198,87,70,.22);--warning-border:rgba(198,87,70,.45);
  --success-badge-bg:rgba(6,78,59,.3);--success-badge-text:#6ee7b7;--success-badge-border:#059669;
  --failure-badge-bg:rgba(198,87,70,.24);--failure-badge-text:#f1b0a6;--failure-badge-border:rgba(198,87,70,.5);
  --count-badge-bg:rgba(139,134,128,.28);--count-badge-text:var(--primary-active);
  --shadow:0 1px 3px 0 rgb(0 0 0/.3);--shadow-lg:0 10px 15px -3px rgb(0 0 0/.3);
  --amber-color:#f59e0b;--amber-text:#fcd34d;
  --amber-10:color-mix(in srgb,var(--amber-color) 14%,transparent);
  --amber-30:color-mix(in srgb,var(--amber-color) 38%,transparent);
  --glass-border:color-mix(in srgb,var(--border-color) 55%,transparent);
  --viz-success:#0fae78;--viz-failure:#cf4b3a;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg-secondary);color:var(--text-primary);font:14px/1.55 var(--font-body);min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:var(--primary-active);text-decoration:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--bg-secondary)}
::-webkit-scrollbar-thumb{background:var(--border-color);border-radius:99px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:var(--radius-md);padding:10px 16px;font:600 13.5px var(--font-body);cursor:pointer;transition:all 150ms ease;background:var(--bg-secondary);color:var(--text-primary);white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--primary-color);color:var(--primary-contrast);border-color:var(--primary-color)}
.btn-primary:hover{background:var(--primary-hover)}
.btn-secondary{background:var(--bg-tertiary);border-color:var(--border-color);color:var(--text-primary)}
.btn-secondary:hover{background:var(--bg-hover);border-color:var(--border-hover)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--text-secondary)}
.btn-ghost:hover{color:var(--text-primary);background:var(--bg-tertiary)}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:6px}
.btn-block{width:100%}

input,select{width:100%;border:1px solid var(--border-color);border-radius:var(--radius-md);padding:10px 12px;background:var(--bg-secondary);color:var(--text-primary);font:14px var(--font-body);transition:border-color 150ms ease,box-shadow 150ms ease}
input:focus,select:focus{outline:none;border-color:var(--primary-color);box-shadow:0 0 0 3px rgba(139,134,128,.18)}
label{font-weight:600;font-size:13px;display:block;margin-bottom:5px}
.form-group{margin-bottom:14px}

.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font:600 11.5px var(--font-mono);border:1px solid var(--border-color);color:var(--text-secondary)}
.badge-success{background:var(--success-badge-bg);color:var(--success-badge-text);border-color:var(--success-badge-border)}
.badge-error{background:var(--failure-badge-bg);color:var(--failure-badge-text);border-color:var(--failure-badge-border)}
.badge-warn{background:var(--amber-10);color:var(--amber-text);border-color:var(--amber-30)}
.badge-dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--text-tertiary)}

/* Topbar */
.topbar{position:sticky;top:0;z-index:50;background:var(--glass-bg);backdrop-filter:var(--glass-backdrop-filter);-webkit-backdrop-filter:var(--glass-backdrop-filter);border-bottom:1px solid var(--border-color)}
.topbar-in{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:32px;height:32px;border-radius:9px;background:var(--primary-10);border:1px solid var(--primary-30);display:flex;align-items:center;justify-content:center;color:var(--primary-active)}
.brand-mark svg{width:16px;height:16px}
.brand h1{font-size:14.5px;font-weight:700;letter-spacing:-.01em}
.brand p{font:500 10px var(--font-mono);color:var(--text-tertiary);letter-spacing:.08em}
.tabs{display:flex;gap:2px;flex-wrap:wrap;margin-left:auto}
.tab-btn{background:none;border:none;padding:8px 13px;border-radius:var(--radius-md);cursor:pointer;font:600 13px var(--font-body);color:var(--text-secondary);transition:all 150ms ease}
.tab-btn:hover{background:var(--bg-tertiary);color:var(--text-primary)}
.tab-btn.active{background:var(--primary-8);color:var(--primary-active)}
.user-chip{display:flex;align-items:center;gap:8px;font:600 12px var(--font-mono);color:var(--text-secondary)}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--primary-10);border:1px solid var(--primary-30);display:flex;align-items:center;justify-content:center;font:700 12px var(--font-body);color:var(--primary-active);text-transform:uppercase}

.wrap{max-width:1040px;margin:0 auto;padding:30px 20px 70px}

/* Hero (home) */
.hero{position:relative;display:flex;flex-direction:column;gap:12px;padding:26px 28px;border-radius:20px;border:1px solid var(--glass-border);background:linear-gradient(145deg,color-mix(in srgb,var(--bg-primary) 90%,transparent),color-mix(in srgb,var(--bg-secondary) 74%,transparent));box-shadow:var(--shadow-lg);overflow:hidden;margin-bottom:22px}
.hero-ambient{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 70% 90% at 82% 0%,color-mix(in srgb,var(--viz-success) 8%,transparent),transparent 65%)}
.hero h2{font-size:clamp(24px,3.4vw,34px);font-weight:700;letter-spacing:-.03em;line-height:1.12;position:relative}
.hero .sub{color:var(--text-secondary);font-size:14px;position:relative;max-width:56ch}
.hero .row{display:flex;gap:10px;margin-top:6px;position:relative;flex-wrap:wrap}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:22px}
.stat{display:flex;flex-direction:column;gap:5px;padding:20px;border-radius:14px;border:1px solid var(--border-color);background:color-mix(in srgb,var(--bg-primary) 82%,transparent)}
.stat::before{content:'';width:24px;height:3px;border-radius:99px;background:var(--tile-accent,var(--border-hover))}
.stat .l{font-size:12px;font-weight:600;color:var(--text-secondary)}
.stat .v{font:600 24px/1.15 var(--font-mono);font-variant-numeric:tabular-nums}

/* Card + table */
.card{background:var(--bg-primary);border:1px solid var(--border-color);border-radius:14px;box-shadow:var(--shadow);margin-bottom:18px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px 20px;border-bottom:1px solid var(--border-color)}
.card-head h2{font-size:15.5px;font-weight:650;letter-spacing:-.01em}
.card-pad{padding:20px}
.tbl-wrap{border:1px solid var(--border-color);border-radius:var(--radius-md);overflow:hidden;background:var(--bg-primary);margin-bottom:18px}
.tbl-scroll{overflow-x:auto}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
thead{background:var(--muted-bg)}
thead th{color:var(--muted-foreground);font-weight:500;font-size:12px;text-align:left;padding:10px 14px;border-bottom:1px solid var(--border-color);white-space:nowrap}
tbody td{padding:12px 14px;border-bottom:1px solid var(--border-color);vertical-align:top}
tbody tr{transition:background 150ms ease}
tbody tr:hover td{background:color-mix(in srgb,var(--accent-bg) 50%,transparent)}
tbody tr:last-child td{border-bottom:none}
.tbl-empty{padding:34px;text-align:center;color:var(--text-tertiary);font-size:13px}
.meter{height:5px;border-radius:99px;background:var(--bg-tertiary);overflow:hidden;margin-top:5px}
.meter i{display:block;height:100%;background:var(--viz-success)}
.meter i.warn{background:var(--quota-medium-color)}
.meter i.bad{background:var(--viz-failure)}

/* Package cards */
.pkg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.pkg{border:1px solid var(--border-color);border-radius:14px;background:var(--bg-primary);padding:22px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);transition:border-color 150ms ease,transform var(--dur-hover) var(--ease-out-strong)}
.pkg:hover{border-color:var(--border-hover);transform:translateY(-2px)}
.pkg h3{font-size:16px;font-weight:650}
.pkg .desc{color:var(--text-secondary);font-size:13px;min-height:20px}
.pkg .specs{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pkg .price{font:700 22px var(--font-mono);letter-spacing:-.01em;margin-top:auto;padding-top:8px;border-top:1px solid var(--border-color);font-variant-numeric:tabular-nums}
.pkg .buy{margin-top:10px;display:flex;flex-direction:column;gap:8px}

/* Auth */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg-secondary)}
.auth-card{width:100%;max-width:400px;background:var(--bg-primary);border:1px solid var(--border-color);border-radius:20px;padding:36px;box-shadow:var(--shadow-lg)}
.auth-card .brand{margin-bottom:22px}
.auth-card h2{font-size:18px;font-weight:700;margin-bottom:4px}
.auth-card>p{color:var(--text-secondary);font-size:13px;margin-bottom:22px}
.auth-switch{margin-top:16px;text-align:center;font-size:13px;color:var(--text-secondary)}

/* misc */
.toast{position:fixed;top:20px;right:20px;z-index:2000;background:var(--floating-surface);color:var(--text-primary);border:1px solid var(--border-color);border-radius:10px;padding:11px 18px;font-size:13.5px;font-weight:500;box-shadow:var(--floating-shadow);animation:tIn .25s var(--ease-out-strong)}
.toast.err{border-color:var(--warning-border);background:var(--warning-bg)}
@keyframes tIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.modal-overlay{position:fixed;inset:0;background:rgba(20,18,15,.45);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;backdrop-filter:blur(3px)}
.modal{background:var(--floating-surface);border-radius:16px;box-shadow:var(--floating-shadow);width:100%;max-width:480px;max-height:85vh;overflow-y:auto;border:1px solid var(--border-color)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border-color)}
.modal-head h3{font-size:15.5px;font-weight:650}
.modal-body{padding:20px}
.close-x{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:none;border:none;color:var(--text-tertiary);cursor:pointer}
.close-x:hover{background:var(--bg-tertiary);color:var(--text-primary)}
.reveal{font:13px/1.6 var(--font-mono);background:var(--bg-quinary);border:1px dashed var(--border-hover);border-radius:10px;padding:14px 16px;word-break:break-all;margin:12px 0}
.note{font-size:13px;color:var(--text-secondary);line-height:1.6}
.empty{text-align:center;padding:34px;color:var(--text-tertiary)}
.skel{border-radius:8px;background:linear-gradient(90deg,var(--bg-tertiary) 25%,var(--bg-quinary) 50%,var(--bg-tertiary) 75%);background-size:200% 100%;animation:skel 1.4s infinite;margin-bottom:14px}
@keyframes skel{from{background-position:200% 0}to{background-position:-200% 0}}
@media (max-width:760px){.stats{grid-template-columns:1fr}.tabs{order:3;width:100%;margin-left:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<script>
'use strict';
const $  = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmtInt = n => (n||0).toLocaleString('vi-VN');
const fmtMicro = n => ((n||0)/1e6).toLocaleString('vi-VN',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' cr';
const fmtDate = ts => ts ? new Date(ts).toLocaleString('vi-VN',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}) : '—';

let token = localStorage.getItem('mkp_portal_token') || '';
let me = null;
let page = 'home';

/* theme: tự lưu + theo system */
(function(){
  const saved = localStorage.getItem('mkp_theme');
  if (saved === 'dark') document.documentElement.setAttribute('data-theme','dark');
  else if (!saved && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)
    document.documentElement.setAttribute('data-theme','dark');
})();
function toggleTheme(){
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  if (dark) { document.documentElement.removeAttribute('data-theme'); localStorage.setItem('mkp_theme','light'); }
  else { document.documentElement.setAttribute('data-theme','dark'); localStorage.setItem('mkp_theme','dark'); }
}
const IC_KEY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>';

async function api(method, path, body){
  const opts = { method, headers:{} };
  if (token) opts.headers['Authorization'] = 'Bearer '+token;
  if (body !== undefined){ opts.headers['Content-Type']='application/json'; opts.body = JSON.stringify(body); }
  const r = await fetch(path, opts);
  const data = await r.json().catch(()=>({}));
  if (r.status === 401){ token=''; localStorage.removeItem('mkp_portal_token'); showAuth(); throw new Error('Phiên đăng nhập hết hạn'); }
  if (!r.ok) throw new Error(data.error || (method+' '+path+': '+r.status));
  return data;
}
function toast(msg, isErr){
  const el = document.createElement('div');
  el.className = 'toast'+(isErr?' err':'');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 3000);
}
function showModal(html){
  const ov = document.createElement('div');
  ov.className = 'modal-overlay';
  ov.innerHTML = '<div class="modal">'+html+'</div>';
  ov.addEventListener('click', e => { if(e.target===ov) ov.remove(); });
  document.body.appendChild(ov);
  return ov;
}
function closeModal(){ $('.modal-overlay')?.remove(); }
function copyText(t){ navigator.clipboard.writeText(t).then(()=>toast('Đã copy vào clipboard')).catch(()=>toast('Không copy được', true)); }

/* ===== AUTH ===== */
function showAuth(mode){
  mode = mode || 'login';
  document.getElementById('root').innerHTML =
  '<div class="auth-wrap"><div class="auth-card">'
    + '<div class="brand"><div class="brand-mark">'+IC_KEY+'</div><div><h1>Manager Key Pro</h1><p>PORTAL</p></div></div>'
    + '<h2>'+(mode==='login'?'Đăng nhập':'Tạo tài khoản mới')+'</h2>'
    + '<p>Username + mật khẩu, không cần email.</p>'
    + '<div id="auth-err"></div>'
    + '<div class="form-group"><label>Username</label><input id="a-user" autocomplete="username" placeholder="username"></div>'
    + '<div class="form-group"><label>Mật khẩu</label><input id="a-pass" type="password" autocomplete="'+(mode==='login'?'current-password':'new-password')+'" placeholder="••••••••" onkeydown="if(event.key===\'Enter\')doAuth(\''+mode+'\')"></div>'
    + '<button class="btn btn-primary btn-block" onclick="doAuth(\''+mode+'\')">'+(mode==='login'?'Đăng nhập':'Đăng ký')+'</button>'
    + '<div class="auth-switch">'
      + (mode==='login'
        ? 'Chưa có tài khoản? <a href="#" onclick="showAuth(\'register\');return false">Đăng ký</a>'
        : 'Đã có tài khoản? <a href="#" onclick="showAuth(\'login\');return false">Đăng nhập</a>')
    + '</div>'
  + '</div></div>';
  setTimeout(()=>$('#a-user')?.focus(), 80);
}
async function doAuth(mode){
  try {
    const body = {username: $('#a-user').value.trim(), password: $('#a-pass').value};
    const r = await api('POST', mode==='login'?'/auth/login':'/auth/register', body);
    token = r.session_token; localStorage.setItem('mkp_portal_token', token);
    await boot();
  } catch(e){ $('#auth-err').innerHTML = '<p class="note" style="color:var(--error-color);margin-bottom:12px">'+esc(e.message)+'</p>'; }
}
async function boot(){
  try { me = await api('GET','/me'); render(); }
  catch(e){ showAuth(); }
}
async function logout(){
  try{ await api('POST','/auth/logout'); }catch(e){}
  token=''; localStorage.removeItem('mkp_portal_token'); showAuth();
}

/* ===== SHELL ===== */
function render(){
  const tabs = [['home','Tổng quan'],['keys','Keys'],['shop','Mua gói'],['wallet','Ví'],['ref','Affiliate'],['usage','Lịch sử'],['check','Kiểm tra key'],['account','Tài khoản']];
  document.getElementById('root').innerHTML =
  '<div class="topbar"><div class="topbar-in">'
    + '<div class="brand"><div class="brand-mark">'+IC_KEY+'</div><div><h1>Manager Key Pro</h1><p>PORTAL</p></div></div>'
    + '<div class="tabs">'
      + tabs.map(([id,l])=>'<button class="tab-btn'+(page===id?' active':'')+'" onclick="page=\''+id+'\';render()">'+l+'</button>').join('')
    + '</div>'
    + '<div class="user-chip"><span class="avatar">'+esc((me.username||'?')[0])+'</span>'+esc(me.username)
      + '<button class="btn btn-ghost btn-sm" onclick="toggleTheme()" title="Đổi giao diện"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg></button>'
      + '<button class="btn btn-ghost btn-sm" onclick="logout()">Thoát</button>'
    + '</div>'
  + '</div></div>'
  + '<div class="wrap"><div id="content"><div class="skel" style="height:110px"></div><div class="skel" style="height:220px"></div></div></div>';
  loadPage();
}
async function loadPage(){
  const c = $('#content');
  try {
    if (page==='home') c.innerHTML = await pHome();
    else if (page==='keys') c.innerHTML = await pKeys();
    else if (page==='shop') c.innerHTML = await pShop();
    else if (page==='wallet') c.innerHTML = await pWallet();
    else if (page==='ref') c.innerHTML = await pRef();
    else if (page==='usage') c.innerHTML = await pUsage();
    else if (page==='check') { c.innerHTML = await pCheck(); return; }
    else if (page==='account') c.innerHTML = await pAccount();
  } catch(e){ c.innerHTML = '<div class="card card-pad"><p class="note" style="color:var(--error-color)">'+esc(e.message)+'</p></div>'; }
}

/* ===== PAGES ===== */
async function pHome(){
  me = await api('GET','/me');
  const keys = await api('GET','/me/keys');
  const keyCount = (keys.keys||[]).length;
  const activeKeys = (keys.keys||[]).filter(k=>k.status==='active').length;
  return '<div class="hero"><div class="hero-ambient"></div>'
    + '<h2>Chào '+esc(me.username)+'.</h2>'
    + '<p class="sub">Mua gói để nhận key, nạp ví qua admin, và bật overflow để chi phí tràn sang ví khi key hết hạn mức.</p>'
    + '<div class="row"><button class="btn btn-primary" onclick="page=\'shop\';render()">Mua gói</button>'
    + '<button class="btn btn-secondary" onclick="page=\'keys\';render()">Xem keys của tôi</button></div>'
  + '</div>'
  + '<div class="stats">'
    + '<div class="stat" style="--tile-accent:var(--viz-success)"><span class="l">Số dư ví</span><span class="v">'+fmtMicro(me.balance)+'</span></div>'
    + '<div class="stat" style="--tile-accent:var(--primary-color)"><span class="l">Key hoạt động</span><span class="v">'+fmtInt(activeKeys)+'<span class="muted" style="font-size:14px"> / '+fmtInt(keyCount)+'</span></span></div>'
    + '<div class="stat" style="--tile-accent:var(--amber-color)"><span class="l">Mã giới thiệu</span><span class="v" style="font-size:18px">'+esc(me.referral_code||'—')+'</span></div>'
  + '</div>';
}

async function pKeys(){
  const r = await api('GET','/me/keys');
  const rows = (r.keys||[]).map(k => {
    const pct = k.quota_amount>0 ? Math.min(100, k.quota_used/k.quota_amount*100) : 0;
    const mCls = pct>=90?'bad':pct>=70?'warn':'';
    return '<tr>'
      + '<td><span class="mono">'+esc(k.prefix)+'</span><div class="muted" style="font-size:11.5px;margin-top:2px">'+esc(k.name||'')+(k.plan_type==='windowed'?' · ⏱ '+fmtInt(k.window_hours||0)+' giờ':' · lifetime')+'</div></td>'
      + '<td style="min-width:140px"><span class="badge">'+esc(k.quota_kind)+'/'+esc(k.quota_scope)+'</span><div class="mono" style="font-size:12px;margin-top:4px">'+fmtInt(k.quota_used)+' / '+fmtInt(k.quota_amount)+' ('+pct.toFixed(0)+'%)</div><div class="meter"><i class="'+mCls+'" style="width:'+pct+'%"></i></div></td>'
      + '<td>'+(k.status==='active'?'<span class="badge badge-success"><i class="badge-dot"></i>active</span>':'<span class="badge badge-warn"><i class="badge-dot"></i>'+esc(k.status)+'</span>')+'<div class="muted" style="font-size:11.5px;margin-top:3px">hạn: '+(k.expires_at>0?fmtDate(k.expires_at):'∞')+'</div></td>'
      + '<td>'+(k.overflow_to_wallet?'<span class="badge badge-success">bật</span>':'<span class="badge">tắt</span>')+'</td>'
      + '<td><div style="display:flex;gap:6px;flex-wrap:wrap">'
        + '<button class="btn btn-secondary btn-sm" onclick="reveal(\''+k.id+'\')">Xem key</button>'
        + '<button class="btn btn-ghost btn-sm" onclick="toggleOverflow(\''+k.id+'\','+(!k.overflow_to_wallet)+')">'+(k.overflow_to_wallet?'Tắt':'Bật')+' overflow</button>'
      + '</div></td>'
    + '</tr>';
  }).join('');
  return '<div class="card"><div class="card-head"><h2>Keys của tôi</h2><span class="muted" style="font-size:12.5px">'+fmtInt((r.keys||[]).length)+' key</span></div>'
    + '<div class="tbl-scroll"><table>'
    + '<thead><tr><th>Key</th><th>Quota</th><th>Trạng thái</th><th>Overflow</th><th></th></tr></thead>'
    + '<tbody>'+(rows || '<tr><td colspan="6" class="tbl-empty">Chưa có key nào — hãy mua gói đầu tiên.</td></tr>')+'</tbody>'
    + '</table></div></div>';
}
async function reveal(id){
  try {
    const r = await api('POST','/me/keys/reveal',{id});
    showModal('<div class="modal-head"><h3>Plain key</h3><button class="close-x" onclick="closeModal()"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>'
    + '<div class="modal-body"><p class="note">Có thể xem lại key này bất cứ lúc nào.</p>'
    + '<div class="reveal">'+esc(r.plain_key)+'</div>'
    + '<button class="btn btn-primary btn-block" onclick="copyText(\''+esc(r.plain_key)+'\')">Copy key</button></div>');
  } catch(e){ toast(e.message, true); }
}
async function toggleOverflow(id, on){
  try { await api('POST','/me/keys/update',{id, overflow_to_wallet: on}); toast('Đã cập nhật'); render(); }
  catch(e){ toast(e.message, true); }
}

async function pShop(){
  const [pkgs, keys] = await Promise.all([api('GET','/me/packages'), api('GET','/me/keys')]);
  const myKeys = keys.keys||[];
  const list = (pkgs.packages||[]).map(p =>
    '<div class="pkg">'
      + '<h3>'+esc(p.name)+'</h3>'
      + '<div class="desc">'+esc(p.description||'')+'</div>'
      + '<div class="specs"><span class="badge">'+(p.plan_type==='windowed'?'⏱ '+fmtInt(p.window_hours||0)+' giờ':'∞ lifetime')+'</span><span class="mono" style="font-size:12px">'+esc(p.quota_kind)+'/'+esc(p.quota_scope)+' · '+fmtInt(p.quota_amount)+'</span><span class="muted" style="font-size:12px">'+(p.duration_days>0?p.duration_days+' ngày':'trọn đời')+'</span></div>'
      + '<div class="price">'+fmtMicro(p.price_credit)+'</div>'
      + '<div class="buy">'
        + '<button class="btn btn-primary btn-block" onclick="buy(\''+p.id+'\',\'new_key\')">Mua key mới</button>'
        + (myKeys.length
          ? '<select id="rk-'+p.id+'" style="font-size:12.5px;padding:8px 10px">'+myKeys.map(k=>'<option value="'+k.id+'">'+esc(k.prefix)+' '+esc(k.name||'')+'</option>').join('')+'</select>'
            + '<button class="btn btn-secondary btn-block" onclick="buy(\''+p.id+'\',\'renew\')">Gia hạn key đã chọn</button>'
          : '')
      + '</div>'
    + '</div>').join('');
  return '<div class="card"><div class="card-head"><h2>Cửa hàng gói</h2><span class="note">Số dư: <strong class="mono">'+fmtMicro(me.balance)+'</strong></span></div>'
    + '<div class="card-pad"><p class="note" style="margin-bottom:16px">Mua gói sẽ trừ ví và tự sinh key cho bạn. Gia hạn sẽ cộng quota/thời hạn vào key cũ.</p>'
    + '<div class="pkg-grid">'+(list || '<div class="tbl-empty">Chưa có gói nào được mở bán.</div>')+'</div></div></div>';
}
async function buy(pkgID, kind){
  try {
    const body = {package_id: pkgID, kind};
    if (kind==='renew') body.key_id = $('#rk-'+pkgID).value;
    const r = await api('POST','/me/orders', body);
    if (r.plain_key){
      showModal('<div class="modal-head"><h3>Mua thành công</h3><button class="close-x" onclick="closeModal()"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>'
      + '<div class="modal-body"><p class="note">Key mới của bạn — lưu lại, có thể xem lại trong mục Keys.</p>'
      + '<div class="reveal">'+esc(r.plain_key)+'</div>'
      + '<button class="btn btn-primary btn-block" onclick="copyText(\''+esc(r.plain_key)+'\')">Copy key</button></div>');
    } else toast('Gia hạn thành công');
    me = await api('GET','/me'); page='keys'; render();
  } catch(e){ toast(e.message, true); }
}

async function pWallet(){
  const r = await api('GET','/me/wallet');
  const rows = (r.ledger||[]).map(e => '<tr>'
    + '<td class="mono muted" style="font-size:11.5px">'+fmtDate(e.created_at)+'</td>'
    + '<td><span class="badge">'+esc(e.reason)+'</span></td>'
    + '<td class="mono" style="color:'+(e.delta>=0?'var(--viz-success)':'var(--viz-failure)')+'">'+(e.delta>=0?'+':'')+fmtMicro(e.delta)+'</td>'
    + '<td class="mono">'+fmtMicro(e.balance_after)+'</td>'
  + '</tr>').join('');
  return '<div class="stats" style="grid-template-columns:repeat(2,1fr)">'
    + '<div class="stat" style="--tile-accent:var(--viz-success)"><span class="l">Số dư hiện tại</span><span class="v">'+fmtMicro(r.balance)+'</span></div>'
    + '<div class="stat" style="--tile-accent:var(--primary-color)"><span class="l">Chế độ ví</span><span class="v" style="font-size:17px">'+esc(r.wallet_mode||'prepaid')+'</span></div>'
  + '</div>'
  + '<div class="card"><div class="card-head"><h2>Sổ cái</h2></div>'
    + '<div class="card-pad" style="padding-bottom:0"><p class="note" style="margin-bottom:14px">Nạp ví qua admin hoặc webhook Telegram. Mọi biến động đều được ghi lại ở đây.</p></div>'
    + '<div class="tbl-scroll"><table>'
    + '<thead><tr><th>Thời gian</th><th>Lý do</th><th>Biến động</th><th>Số dư</th></tr></thead>'
    + '<tbody>'+(rows || '<tr><td colspan="4" class="tbl-empty">Chưa có giao dịch nào.</td></tr>')+'</tbody>'
    + '</table></div></div>';
}

async function pRef(){
  const r = await api('GET','/me/referrals');
  return '<div class="stats">'
    + '<div class="stat" style="--tile-accent:var(--primary-color)"><span class="l">Mã giới thiệu</span><span class="v" style="font-size:19px">'+esc(r.referral_code||'—')+'</span></div>'
    + '<div class="stat" style="--tile-accent:var(--amber-color)"><span class="l">Tuyến dưới</span><span class="v">'+fmtInt(r.downline_count||0)+'</span></div>'
    + '<div class="stat" style="--tile-accent:var(--viz-success)"><span class="l">Đã nhận thưởng</span><span class="v" style="font-size:19px">'+fmtMicro(r.total_earned)+'</span></div>'
  + '</div>'
  + '<div class="card"><div class="card-head"><h2>Link giới thiệu</h2></div>'
    + '<div class="card-pad">'
      + '<div style="display:flex;gap:8px"><input id="ref-link" value="'+esc(r.referral_link||'')+'" readonly onclick="this.select()">'
      + '<button class="btn btn-primary" onclick="copyText($(\'#ref-link\').value)">Copy</button></div>'
      + '<p class="note" style="margin-top:12px">Thưởng chỉ được trả khi tuyến dưới nạp tiền thật — không thưởng cho đăng ký suông.</p>'
    + '</div></div>';
}

async function pUsage(){
  const r = await api('GET','/me/usage');
  const rows = (r.usage||[]).map(u => '<tr>'
    + '<td class="mono muted" style="font-size:11.5px">'+fmtDate(u.created_at)+'</td>'
    + '<td>'+esc(u.alias||u.model||'')+(u.model&&u.alias&&u.model!==u.alias?'<div class="muted" style="font-size:10.5px">'+esc(u.model)+'</div>':'')+'</td>'
    + '<td class="mono">'+fmtInt(u.input_tokens)+' / '+fmtInt(u.output_tokens)+'<div class="muted" style="font-size:10.5px">cache '+fmtInt((u.cache_read_tokens||0)+(u.cache_creation_tokens||0))+'</div></td>'
    + '<td class="mono">'+fmtMicro(u.cost)+'</td>'
    + '<td>'+(u.status==='ok'?'<span class="badge badge-success"><i class="badge-dot"></i>ok</span>':'<span class="badge badge-error">'+esc(u.status||'—')+'</span>')+'</td>'
    + '<td>'+(u.source==='wallet'?'<span class="badge badge-success">ví</span>':u.source==='key_quota'?'<span class="badge">key</span>':'<span class="badge">—</span>')+'</td>'
  + '</tr>').join('');
  return '<div class="card"><div class="card-head"><h2>Lịch sử sử dụng</h2><span class="muted" style="font-size:12.5px">'+fmtInt((r.usage||[]).length)+' bản ghi</span></div>'
    + '<div class="tbl-scroll"><table>'
    + '<thead><tr><th>Thời gian</th><th>Model</th><th>In / Out</th><th>Chi phí</th><th>Trạng thái</th><th>Nguồn</th></tr></thead>'
    + '<tbody>'+(rows || '<tr><td colspan="5" class="tbl-empty">Chưa có request nào.</td></tr>')+'</tbody>'
    + '</table></div></div>';
}

async function pCheck(){
  return '<div class="card"><div class="card-head"><h2>Kiểm tra key</h2></div>'
    + '<div class="card-pad">'
    + '<p class="note" style="margin-bottom:14px">Dán key vào để xem trạng thái, hạn mức còn lại và chu kỳ reset — không cần đăng nhập. Đây cũng là API công khai: <span class="mono">GET /v1/key/check</span> (header <span class="mono">Authorization: Bearer KEY</span> hoặc <span class="mono">X-Api-Key</span>).</p>'
    + '<div class="form-group"><label>Plain key</label><input id="chk-input" type="password" placeholder="mkp_..." onkeydown="if(event.key===\'Enter\')doCheck()"></div>'
    + '<button class="btn btn-primary" onclick="doCheck()">Kiểm tra</button>'
    + '<div id="chk-result" style="margin-top:16px"></div>'
    + '</div></div>';
}
async function doCheck(){
  const key = $('#chk-input').value.trim();
  if (!key){ toast('Nhập key trước', true); return; }
  try {
    const r = await fetch('/v1/key/check', {headers:{'Authorization':'Bearer '+key}});
    const d = await r.json();
    if (!r.ok){ $('#chk-result').innerHTML = '<span class="badge badge-error">'+esc(d.error||'invalid_api_key')+'</span>'; return; }
    const pct = d.quota_amount>0 ? Math.min(100, d.quota_used/d.quota_amount*100) : 0;
    const mCls = pct>=90?'bad':pct>=70?'warn':'';
    $('#chk-result').innerHTML =
      '<div class="stats" style="grid-template-columns:repeat(2,1fr)">'
      + '<div class="stat" style="--tile-accent:'+(d.status==='active'?'var(--viz-success)':'var(--viz-failure)')+'"><span class="l">Trạng thái</span><span class="v" style="font-size:17px">'+esc(d.status)+'</span></div>'
      + '<div class="stat" style="--tile-accent:var(--primary-color)"><span class="l">Plan</span><span class="v" style="font-size:15px">'+(d.plan_type==='windowed'?'⏱ '+fmtInt(d.window_hours||0)+' giờ':'∞ lifetime')+'</span></div>'
      + '</div>'
      + '<div class="card" style="margin-top:12px"><div class="card-pad">'
      + '<div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px"><span>Đã dùng</span><span class="mono">'+fmtInt(d.quota_used)+' / '+fmtInt(d.quota_amount)+'</span></div>'
      + '<div class="meter" style="height:8px"><i class="'+mCls+'" style="width:'+pct+'%"></i></div>'
      + '<div style="display:flex;justify-content:space-between;font-size:13px;margin-top:10px"><span>Còn lại</span><span class="mono">'+fmtInt(d.quota_remaining)+' '+esc(d.quota_kind)+'</span></div>'
      + '<div style="display:flex;justify-content:space-between;font-size:13px;margin-top:4px"><span>Hết hạn key</span><span class="mono">'+(d.expires_at>0?fmtDate(d.expires_at):'∞')+'</span></div>'
      + (d.period_end>0?'<div style="display:flex;justify-content:space-between;font-size:13px;margin-top:4px"><span>Reset chu kỳ</span><span class="mono">'+fmtDate(d.period_end)+'</span></div>':'')
      + '<div style="display:flex;justify-content:space-between;font-size:13px;margin-top:4px"><span>Overflow ví</span><span>'+(d.overflow_to_wallet?'bật':'tắt')+'</span></div>'
      + '</div></div>';
  } catch(e){ toast('Lỗi: '+e.message, true); }
}
async function pAccount(){
  me = await api('GET','/me');
  return '<div class="card"><div class="card-head"><h2>Tài khoản</h2></div>'
    + '<div class="card-pad">'
    + '<div class="stats" style="grid-template-columns:repeat(3,1fr);margin-bottom:18px">'
    + '<div class="stat" style="--tile-accent:var(--primary-color)"><span class="l">Username</span><span class="v" style="font-size:16px">'+esc(me.username)+'</span></div>'
    + '<div class="stat" style="--tile-accent:var(--viz-success)"><span class="l">Số dư</span><span class="v" style="font-size:16px">'+fmtMicro(me.balance)+'</span></div>'
    + '<div class="stat" style="--tile-accent:var(--amber-color)"><span class="l">Telegram</span><span class="v" style="font-size:14px">'+(me.telegram_id?'đã liên kết':'chưa')+'</span></div>'
    + '</div>'
    + '<div class="form-group"><label>Mật khẩu mới (để trống nếu không đổi)</label><input id="acc-pass" type="password" placeholder="••••••••" autocomplete="new-password"></div>'
    + '<button class="btn btn-primary" onclick="setPass()">Đổi mật khẩu</button>'
    + '<div style="border-top:1px solid var(--border-color);margin:20px 0"></div>'
    + '<div class="form-group"><label>Liên kết Telegram (ID người dùng)</label><input id="acc-tg" placeholder="123456789"></div>'
    + '<button class="btn btn-secondary" onclick="linkTg()">Liên kết Telegram</button>'
    + '<div style="border-top:1px solid var(--border-color);margin:20px 0"></div>'
    + '<button class="btn btn-secondary" onclick="logout()">Đăng xuất</button>'
    + '</div></div>';
}
async function setPass(){
  try { await api('POST','/me/set-password',{password:$('#acc-pass').value}); toast('Đã đổi mật khẩu'); }
  catch(e){ toast(e.message, true); }
}
async function linkTg(){
  try { await api('POST','/me/link-telegram',{telegram_id:$('#acc-tg').value.trim()}); toast('Đã liên kết Telegram'); }
  catch(e){ toast(e.message, true); }
}

/* boot + ref cookie */
(function(){
  const m = location.search.match(/[?&]ref=([^&]+)/);
  if (m) document.cookie = 'mkp_ref='+encodeURIComponent(m[1])+';path=/;max-age='+(30*86400);
})();
function renderGuest(){
  document.getElementById('root').innerHTML =
  '<div class="topbar"><div class="topbar-in">'
    + '<div class="brand"><div class="brand-mark">'+IC_KEY+'</div><div><h1>Manager Key Pro</h1><p>PORTAL</p></div></div>'
    + '<div class="tabs"><button class="tab-btn active">Kiểm tra key</button><button class="tab-btn" onclick="showAuth()">Đăng nhập</button></div>'
  + '</div></div>'
  + '<div class="wrap"><div id="content"></div></div>';
  loadPage();
}
if (token) boot(); else { page='check'; renderGuest(); }
</script>
</body>
</html>
